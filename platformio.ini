; PlatformIO Project Configuration
; Target: Seeed XIAO nRF52840 + M5Stack ATOM EchoS3R

[env:xiaonrf52840]
platform = nordicnrf52
board = seeed_xiao_nrf52840
upload_port = /dev/cu.usbmodem2101
framework = arduino

lib_deps =
    ; Bluefruit52Lib (bundled with framework) already includes TinyUSB — do NOT add
    ; adafruit/Adafruit TinyUSB Library here; it conflicts with the framework's bundled v1.x

build_flags =
    -DARDUINO_ARCH_NRF52

monitor_speed = 115200
build_src_filter = +<*> -<blink_test.cpp> -<i2s_audio.cpp> -<main.cpp> -<ble_handler.cpp> -<audio_clips.cpp> -<clip_stubs.cpp> -<i2s_audio_stub.cpp>

; M5Stack ATOM EchoS3R — ES8311 test tone (start here)
[env:echos3r_tone]
platform = espressif32
board = m5stack-atoms3
framework = arduino
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
upload_protocol = esptool
upload_flags =
    --before=no_reset
    --after=no_reset
lib_deps =
    m5stack/M5Atomic-EchoBase
build_src_filter = -<*> +<echos3r_tone.cpp>

; EchoS3R main firmware — BLE text → Flite TTS → ES8311 speaker
[env:echos3r]
platform = espressif32
board = m5stack-atoms3
framework = arduino
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
monitor_speed = 115200
upload_protocol = esptool
upload_flags =
    --before=no_reset
    --after=no_reset
lib_deps =
    m5stack/M5Atomic-EchoBase
    https://github.com/pschatzmann/arduino-flite.git
board_build.arduino.memory_type = qio_opi
build_flags =
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
    -DCST_USER_MALLOC
    -DBOARD_HAS_PSRAM
build_src_filter = -<*> +<echos3r_main.cpp>

; Minimal blink test — flash this first to confirm board/toolchain works
[env:blink_test]
platform = nordicnrf52
board = seeed_xiao_nrf52840
framework = arduino
lib_deps =
    adafruit/Adafruit TinyUSB Library
build_flags =
    -DARDUINO_ARCH_NRF52
build_src_filter = -<*> +<blink_test.cpp>
