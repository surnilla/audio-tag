; PlatformIO Project Configuration
; Target: Seeed XIAO nRF52840

[env:xiaonrf52840]
platform = nordicnrf52
board = seeed_xiao_nrf52840
framework = arduino

lib_deps =
    adafruit/Adafruit TinyUSB Library
    ; Add BLE and I2S libs as needed

build_flags =
    -DARDUINO_ARCH_NRF52

monitor_speed = 115200
